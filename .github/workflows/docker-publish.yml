name: Build and publish image

# Builds on every change to the image, weekly (to pick up Alpine security
# updates), and on demand. The opencode version comes from the Dockerfile's
# OPENCODE_VERSION default unless overridden via workflow_dispatch.
on:
  push:
    branches: [main]
    paths: [Dockerfile, entrypoint.sh, .github/workflows/docker-publish.yml]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      opencode_version:
        description: "opencode version to build against (default: Dockerfile value)"
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve versions and image name
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.opencode_version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-$(sed -n 's/^ARG OPENCODE_VERSION=//p' Dockerfile)}"
          if [ -z "$version" ]; then
            echo "::error::could not determine opencode version"
            exit 1
          fi
          {
            echo "version=$version"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "date=$(date -u +%Y%m%d)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: <opencode version> (moves with rebuilds), <version>-<date> and
      # <version>-<sha> (immutable), latest.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            OPENCODE_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.date }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
